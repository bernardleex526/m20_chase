deployment:
  nonhardware: true
  tf_source: champ_robot_state_publisher_velodyne_fixed_joint
rs_follow_node:
  ros__parameters:
    use_sim_time: true
    input_topic: /fixtures/points
    cmd_vel_topic: /rs_follow/cmd_vel
    odom_topic: /odom/ground_truth
    control_frame: base_link
    active: false
    control_rate_hz: 50.0
    cmd_timeout: 0.5
    direct_cmd_timeout: 0.3
    target_observation_timeout: 0.5
    # CHAMP properties.urdf.xacro: base_x=.50, base_y=.29, base_z=.130.
    # Standing base is ~.20m above floor. Bands are relative to base_link.
    height_min: 0.10
    height_max: 1.35
    enable_low_band: true
    low_height_min: -0.12
    low_height_max: 0.08
    range_min: 0.20
    range_max: 12.0
    robot_length: 0.50
    robot_width: 0.29
    auto_frame: true
    self_occlusion_margin: 0.06
    frame_front: 0.31
    frame_back: 0.31
    frame_left: 0.205
    frame_right: 0.205
    follow_dist: 1.0
    target_radius: 0.35
    bind_radius: 0.45
    auto_select_front: false
    k_linear: 0.6
    k_angular: 0.8
    k_lateral: 0.3
    enable_lateral: false
    max_linear: 0.20
    max_angular: 0.35
    max_linear_cmd: 0.20
    max_angular_cmd: 0.35
    max_linear_accel: 0.30
    max_angular_accel: 0.60
    max_linear_jerk: 2.0
    max_angular_jerk: 4.0
    cmd_filter_alpha: 0.60
    k_integral: 0.0
    linear_deadband: 0.08
    linear_hysteresis: 0.03
    angular_deadband: 0.08
    governor_enable: true
    governor_d_hard: 0.25
    governor_d_margin: 0.15
    governor_t_lat: 0.20
    governor_a_max: 0.30
    governor_v_cap: 0.20
    governor_release_hysteresis: 0.15
    governor_emergency_floor: 0.08
    governor_lateral_margin: 0.15
    exclude_target_from_obstacles: true
    vfh_enable: false
    search_enable: false
    recovery_enable: false
    enable_kalman: true
    filter_in_world: true
    compensate_slip: false
twist_adapter:
  ros__parameters:
    use_sim_time: true
    output_topic: /cmd_vel
    lateral: false
    max_vx: 0.20
    max_vy: 0.0
    max_wz: 0.35
    base_frame: base_link
