rs_follow_node:
  ros__parameters:
    # --- input / output ---
    input_topic: "/rslidar_points"
    control_frame: "base_link"  # +x forward, +y left, +z up; requires measured stamped TF
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"          # robot odometry; empty "" disables (falls back to cmd integration)
    compensate_slip: false       # opt in only after validating slip compensation
    slip_min_ratio: 0.3          # ignore ratio estimates below this
    slip_max_ratio: 2.5          # clamp on the estimated actual/cmd ratio
    slip_filter_alpha: 0.1       # low-pass on the ratio estimate
    slip_min_cmd: 0.05           # only estimate when |cmd| exceeds this
    max_linear_cmd: 1.5          # safety ceiling on the compensated linear command
    max_angular_cmd: 2.0         # safety ceiling on the compensated angular command
    active: false                # safety default; enable via ~/enable or launch active:=true
    control_rate_hz: 50.0
    cmd_timeout: 0.5             # publish zero after this long without a scan
    direct_cmd_timeout: 0.3      # stop when a direct command expires (s)
    target_observation_timeout: 0.5  # stop when the bound target is not observed (s)
    publish_scan_debug: true

    # --- 3D cloud -> 2D polar scan projection (TARGET band: person torso) ---
    # All bands are in control_frame, never raw sensor coordinates. These nominal
    # limits migrate the former sensor bands using the old 0.75 m sensor height.
    # Real hardware mounting height/rotation/translation is NOT measured here:
    # keep active=false and the low band disabled until TF and bands are calibrated.
    height_min: 0.35
    height_max: 2.55
    # --- LOW band (near-floor obstacles: steps, curbs, small objects) ---
    # Obstacles only -- never a follow target. Explicit limits exclude the floor.
    enable_low_band: false
    low_height_min: 0.10
    low_height_max: 0.30
    angle_bins: 1440             # 0.25 deg azimuth resolution
    range_min: 0.25
    range_max: 30.0

    # --- follow target / standoff ---
    follow_dist: 1.00            # desired distance to the target (m)
    target_radius: 0.60          # cluster radius around the bound target
    rectangle_width: 0.50        # corridor width used for lateral centring

    # --- control gains ---
    k_linear: 2.50
    k_angular: 1.50
    k_lateral: 0.80
    enable_lateral: true         # needs a holonomic base (dog). false -> only vx/wz
    rotate_in_place_behind: true # if target is behind, rotate without driving forward

    # --- limits / deadbands ---
    max_linear: 0.90
    max_angular: 1.00
    linear_deadband: 0.05
    angular_deadband: 0.08
    min_linear_speed: 0.02
    linear_hysteresis: 0.03     # sticky deadband to avoid on/off chatter
    angular_hysteresis: 0.03
    k_integral: 0.30            # integral gain: removes lag on a moving target
    integral_limit: 1.00        # anti-windup clamp on the integral (m*s)

    # --- output smoothing (applied on the control timer) ---
    max_linear_accel: 0.80      # m/s^2  (vx, vy)
    max_angular_accel: 1.50     # rad/s^2 (wz)
    max_linear_jerk: 8.0        # m/s^3  limit the change of acceleration
    max_angular_jerk: 20.0      # rad/s^3
    cmd_filter_alpha: 0.60      # 0 = off; (0,1] first-order low-pass on cmd

    # --- obstacle avoidance (artificial potential field: lateral nudging only) ---
    apf_influence: 0.60
    apf_gain: 0.02
    apf_emergency: 0.35         # legacy fixed radius; superseded by the governor
    apf_slowdown: 0.70          # legacy; superseded by the governor

    # --- obstacle handling / safety (P0) ---
    exclude_target_from_obstacles: true   # the followed person is not an obstacle
    target_exclude_slack: 0.25            # radial slack on the exclusion window (m)
    direction_gated_obstacles: true       # only the sector being entered may limit
    # Cone that may limit motion along the travel direction. MUST stay < 90 deg:
    # an obstacle at +-90 deg is beside the robot, has no closing component
    # along a forward drive, and must only nudge laterally (corridor following).
    sector_half_angle_deg: 60.0
    # Robot outline (m). SINGLE SOURCE OF TRUTH for the body size: the governor's
    # clearance maths and the self-occlusion frame_* below must agree with it.
    robot_length: 0.62
    robot_width: 0.36
    # Derive the self-occlusion box from the outline above. Leave TRUE unless
    # you have a measured reason not to: a hand-set frame narrower than the body
    # makes the robot see its own chassis as an obstacle.
    auto_frame: true
    self_occlusion_margin: 0.08

    # --- TTC speed governor (replaces the fixed-radius e-stop) ---
    governor_enable: true
    governor_d_hard: 0.25       # hard stop below this clearance (m)
    governor_d_margin: 0.15     # clearance kept from the robot outline (m)
    governor_t_lat: 0.20        # DESIGN ASSUMPTION: measure on the real robot (s)
    governor_a_max: 0.80        # planning deceleration (m/s^2), <= max_linear_accel
    governor_v_cap: 1.50        # limit is non-binding above this (m/s)
    # Clearance that must be regained before a zero hard stop releases.
    # Hysteresis avoids repeated stop/release toggles at the boundary.
    governor_release_hysteresis: 0.15
    # Standoff the TTC curve brakes to (on top of the obstacle's clearance).
    governor_d_margin_slow: 0.05
    # Omnidirectional hard-stop floor: if the body is within this of ANYTHING,
    # in any direction, stop. Kept small so a wall 0.30 m to the side (0.12 m of
    # true clearance) does not freeze a forward drive.
    governor_emergency_floor: 0.08
    # Corridor widening for the speed limit (must stay below the distance to a
    # typical parallel wall, or corridors brake the robot everywhere).
    governor_lateral_margin: 0.25
    governor_stop_margin: 0.05

    # --- gap-based local steering (VFH+): the actual "go around it" logic ---
    # Steers into the cheapest traversable gap in the scan instead of always
    # aiming at the target bearing. This is what turns "stop" into "detour".
    vfh_enable: true
    vfh_bins: 360               # planning resolution (1 deg)
    vfh_d_safe: 0.30            # clearance that makes a heading traversable (m)
    vfh_goal_weight: 1.0        # cost per radian of deviation from the target
    vfh_hysteresis_deg: 10.0    # bonus for keeping the previous heading
    # 180 = consider every heading. Must stay 180 for a follower: the cost
    # function already prefers the person's direction, and clamping it makes a
    # person standing behind the robot unreachable (the robot pirouettes).
    vfh_max_turn_deg: 180.0
    # Derive d_safe from the governor's hard-stop floor + margin. It MUST exceed
    # the stop band, or the planner aims into the very band that stops the robot.
    vfh_auto_d_safe: true
    vfh_d_safe_margin: 0.10

    # --- P2 recovery: turn "stuck" into "recovers" ---
    recovery_enable: false
    recovery_stuck_window: 2.0  # s of no progress before acting
    recovery_stuck_dist: 0.05   # m of travel below which it counts as stuck
    recovery_backup_dist: 0.40  # m to reverse
    recovery_backup_speed: 0.25 # m/s
    recovery_spin_rate: 0.60    # rad/s while looking for a way out
    recovery_spin_timeout: 6.0  # s per spin attempt
    recovery_max_attempts: 3    # then HOLD and report, never retry forever

    # --- P2 target search: re-acquire after the tracker gives up ---
    search_enable: false
    search_coast_time: 1.0      # s of coast before scanning
    search_spin_timeout: 12.0   # s spent scanning for the person
    search_go_speed: 0.35       # m/s toward the last known position
    search_go_tol: 0.5          # m considered "arrived"
    search_go_timeout: 12.0     # s per go-to attempt
    search_budget: 60.0         # total s of searching before HOLD
    search_max_sweeps: 6        # scanning sweeps before HOLD

    # --- robot self-occlusion box (lidar frame) ---
    # MUST be calibrated to the real outline; the original +-0.25 m side values
    # are narrower than most quadrupeds.
    frame_front: 0.25
    frame_back: 0.45
    frame_left: 0.25
    frame_right: 0.25

    # --- target filtering / loss ---
    enable_kalman: true
    kalman_q: 0.10
    kalman_r: 0.05
    kalman_gate: 6.0           # Mahalanobis gate (sigma); reject outlier clusters
    kalman_r_ref_points: 80    # nominal cluster size; R scales as n_ref/n_points
    filter_in_world: true      # filter in an inertial frame (compensate robot rotation)
    lost_frames_timeout: 30

    # --- automatic front target selection when nothing is bound ---
    auto_select_front: false
    auto_front_fov_deg: 40.0
    auto_select_max_range: 8.0

    # --- manual binding ---
    bind_radius: 0.60