<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点云跟随控制</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>点云跟随控制</h1>
      <form id="connectForm">
        <label for="authToken">访问令牌（仅保存在内存）</label>
        <div class="button-row"><input id="authToken" type="password" autocomplete="off" spellcheck="false"><button id="connectButton" type="submit">连接</button></div>
      </form>
      <p id="connectionStatus" role="status">未连接 · 保持暂停</p>
    </header>
    <section class="safety-bar" aria-label="软件停止控制">
      <button id="softwareStop" class="danger" disabled>软件停止</button>
      <button id="releaseStop" disabled>解除停止（不启动）</button>
    </section>
    <p class="warning">网页软件停止不能代替随身物理急停。仅限平坦地面、低速；几何点簇跟随不保证人员身份，交叉或遮挡后可能误认。租约不代表底盘仲裁权限。</p>
    <section class="status-card" aria-label="节点确认状态">
      <p id="nodeState">节点状态未知 · 禁止运动</p>
      <p id="cloudStatus">无点云 · 禁止选择</p>
      <p id="commandStatus">输出指令未知</p>
      <p id="actionStatus" role="status" aria-live="polite">请先连接并选择目标</p>
    </section>
    <nav class="nav-bar" aria-label="控制面板">
      <button class="nav-item active" data-tab="follow" aria-pressed="true">点云跟随</button>
      <button class="nav-item" data-tab="direct" aria-pressed="false">手动控制</button>
    </nav>
    <main id="panel-follow" class="tab-content">
      <h2>点云俯视图</h2>
      <p>+x 向上，+y 向左；颜色按 z 高度：蓝（低）→红（高）。点选附近 ≤0.8m 的真实回波。</p>
      <div class="visualization-panel"><canvas id="lidarCanvas" aria-label="点云俯视图，点击选择候选回波"></canvas></div>
      <p id="candidateStatus">未选择候选</p>
      <div class="button-row">
        <button id="bindTarget" disabled>绑定目标</button>
        <button id="startFollow" disabled>开始跟随</button>
        <button id="pauseFollow" disabled>暂停</button>
        <button id="clearTarget" disabled>取消 / 清除目标</button>
      </div>
    </main>
    <section id="panel-direct" class="tab-content" hidden>
      <h2>手动 DIRECT 控制</h2>
      <p>先显式启用，按住控件才发送；松开或切页立即归零。最大 0.3m/s、横向 0.15m/s、转向 0.5rad/s。</p>
      <div class="button-row"><button id="startDirect" disabled>启用手动</button><button id="pauseDirect" disabled>暂停</button></div>
      <div class="direct-control-container">
        <div id="rotationTrack" class="slider-container" aria-label="按住旋转：左拖左转，右拖右转">
          <span class="slider-label left">左转 (+)</span><span class="slider-label right">右转 (−)</span>
          <div class="slider-track"></div><div id="rotationKnob" class="slider-knob"></div>
        </div>
        <div id="joystickBase" class="joystick-base" aria-label="按住平移摇杆：上前进、左横移">
          <span class="joystick-cross">前 (+x)<br>左 (+y)</span><div id="joystickStick" class="joystick-stick"></div>
        </div>
        <div class="button-row"><button id="btnStandUp" disabled>显式站起</button><button id="btnLieDown" disabled>显式趴下</button></div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
